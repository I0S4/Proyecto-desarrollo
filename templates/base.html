<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}Menús - Universidad{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="https://raw.githubusercontent.com/I0S4/Proyecto-desarrollo/main/Dise%C3%B1o%20Externo/Mockup/Usuario%201.png" alt="logo">
        <div>Sistema de Restaurantes</div>
      </div>
      <nav class="nav">
        <a class="nav-btn" href="{{ url_for('index') }}">Raciones</a>
        <a class="nav-btn" href="#">Catálogos</a>
        <a class="nav-btn" href="#">Maestro de Platos</a>
      </nav>
      <div class="sidebar-footer">
        {% if session.get('user') %}
          <div class="user-info">Usuario: {{ session.get('user') }}</div>
          <a class="logout" href="{{ url_for('logout') }}">Cerrar Sesión</a>
        {% else %}
          <a class="logout" href="{{ url_for('login') }}">Iniciar Sesión</a>
        {% endif %}
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <div class="search">
          <input placeholder="Buscar plato" />
        </div>
        <div class="userlinks">Menú Univ</div>
      </header>

      <section class="content">
        {% block content %}{% endblock %}
      </section>

    </main>
  </div>
</body>
</html>
