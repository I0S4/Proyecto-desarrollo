{% extends "base.html" %}
{% block title %}Inicio — Menús{% endblock %}
{% block content %}
<h2 class="page-title">Menú Universitario</h2>

<div class="filters">
  <label>CATEGORÍA:</label>
  <select>
    <option>Entradas</option>
    <option>Segundos</option>
  </select>
  <label>TIPO DE MENÚ:</label>
  <select>
    <option>Económico</option>
    <option>Premium</option>
  </select>
</div>

<div class="cards-grid">
  {% for r in restaurants %}
  <div class="dish-card">
    <div class="dish-img">
      <img src="{{ r.image }}" alt="{{ r.name }}">
    </div>
    <div class="dish-name">{{ r.name }}</div>
    <div class="dish-price">S/{{ '%.2f'|format(r.menu[0].items[0].price if r.menu and r.menu[0].items else 0) }}</div>
    <div class="dish-status">Disponible</div>
  </div>
  {% endfor %}
</div>

{% endblock %}
